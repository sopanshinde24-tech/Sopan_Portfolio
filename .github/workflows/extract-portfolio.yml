name: Extract Portfolio

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip portfolio archive
        run: |
          mkdir -p /tmp/portfolio
          unzip -o Sopan_Shinde_Portfolio_Download.zip -d /tmp/portfolio
          rm -f Sopan_Shinde_Portfolio_Download.zip

      - name: Copy contents from extracted folder to root
        run: |
          cp -r /tmp/portfolio/sopan-3d-portfolio/* /tmp/portfolio/sopan-3d-portfolio/.* . 2>/dev/null || true

      - name: Clean up temporary files
        run: |
          rm -rf /tmp/portfolio
          find . -name ".gitattributes" -delete

      - name: Remove LFS pointer for character.glb if 132 bytes
        run: |
          if [ -f public/models/character.glb ] && [ "$(wc -c public/models/character.glb | awk '{print $1}')" -eq 132 ]; then
            rm -f public/models/character.glb
          fi

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit extracted files
        run: |
          git add -A
          git commit -m "Extract portfolio into repository root and skip missing LFS pointer" || echo "No changes to commit"
          git push
