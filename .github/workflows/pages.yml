# This is a basic workflow to deploy the site to GitHub Pages
name: Build and deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fix React Router base path for project Pages site
        run: python3 -c "
from pathlib import Path
p = Path('src/App.tsx')
s = p.read_text()
old = '&lt;BrowserRouter&gt;'
new = '&lt;BrowserRouter basename=\"/Sopan_Portfolio\"&gt;'
assert old in s, f'Missing old string in App.tsx'
if new not in s:
    s = s.replace(old, new, 1)
    p.write_text(s)
    print('Replaced:', s.count(new))"
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build with Vite
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
